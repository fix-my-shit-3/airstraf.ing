name: Build Firefox replacements

on:
  push:
    branches: [main]
    paths:
      - 'airstraf.ing-source.zip'
      - 'tools/**'
      - 'extension/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/extract-and-map.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: firefox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract checked-in ZIP safely
        run: python3 tools/unpack_source.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build readable replacement code
        run: npm run build
      - name: Verify readable code and preserved renames
        run: npm run verify
      - name: Package live-site Firefox add-on
        run: npm run build:extension && npm run test:extension
      - name: Upload Firefox add-on
        uses: actions/upload-artifact@v4
        with:
          name: airstraf-firefox-replacement
          path: dist/firefox/
          if-no-files-found: error
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source dist archive-manifest.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build readable Firefox replacement files"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  remove-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish GitHub Pages (keep repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages-result -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          case "$status" in
            204) echo "GitHub Pages unpublished" ;;
            404) echo "No accessible GitHub Pages site found" ;;
            *) cat /tmp/pages-result; exit 1 ;;
          esac
