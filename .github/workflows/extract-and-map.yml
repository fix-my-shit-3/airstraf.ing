name: Extract and map source

on:
  push:
    branches: [main]
    paths:
      - 'airstraf.ing-source.zip'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/extract-and-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-maps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract checked-in ZIP safely
        run: python3 tools/unpack_source.py
      - name: Install mapping dependencies
        run: npm install --no-audit --no-fund
      - name: Build readable code and reverse maps
        run: npm run build:maps
      - name: Verify 100 additional renames and all JS maps
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("dist/report.json", "utf8"));
            const batches = JSON.parse(fs.readFileSync("dist/renames.json", "utf8"));
            const extra = batches.flatMap(x => x.renames).filter(x => x.pass === "additional");
            if (report.additionalIdentifiersRenamed !== 100 || extra.length !== 100)
              throw new Error("Expected exactly 100 new renames; got " + extra.length);
            if (report.successfullyMapped !== report.inputJsFiles)
              throw new Error("Not all JS files have source maps");
            if (!extra.every(x => x.oldName !== x.newName && x.rule && x.line))
              throw new Error("Rename audit contains invalid records");
            console.log("PASS: all " + report.inputJsFiles + " JavaScript files mapped; " +
              extra.length + " evidence-backed additional variable renames");
          '
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source dist archive-manifest.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate extracted source and DevTools source maps"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
