name: Extract and map source

on:
  push:
    branches: [main]
    paths:
      - 'airstraf.ing-source.zip'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/extract-and-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-maps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract checked-in ZIP safely
        run: python3 tools/unpack_source.py
      - name: Install mapping dependencies
        run: npm install --no-audit --no-fund
      - name: Build readable code and reverse maps
        run: npm run build:maps
      - name: Verify 200 new renames, previous work, and every source map
        run: npm run verify:maps
      - name: Upload source maps and audit report
        uses: actions/upload-artifact@v4
        with:
          name: airstraf-devtools-source-maps
          path: |
            dist/maps/
            dist/renames.json
            dist/report.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source dist archive-manifest.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate extracted source and DevTools source maps"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
