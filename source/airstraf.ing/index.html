  <head>
    <style id="boot-style">#boot {
  --u: var(--kour-u, min(calc(100vw / 1920), calc(100vh / 1080)));
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  contain: strict;
  background: radial-gradient(
      ellipse at 50% 0%,
      var(--kour-surface-bar, #262626) 0%,
      var(--kour-bg, #111111) 62%
    )
    var(--kour-bg, #111111);
  color: var(--kour-text, #ffffff);
  font-family: var(--kour-font, 'Poppins', Arial, sans-serif);
  font-weight: var(--kour-weight, 700);
  -webkit-user-select: none;
  user-select: none;
  opacity: 1;
  transition: opacity 450ms ease;
}
.kour-embed > #boot {
  position: absolute;
}
#boot.boot--out {
  opacity: 0;
  pointer-events: none;
}
/* the picture of this boot (FB27: tools/build-loading-screens.py, picked by loading-screen.ts):
   darkened towards the middle so that logo and bar stay readable, a slow drift */
.boot__art {
  position: absolute;
  inset: calc(var(--u) * -40);
  background: center / cover no-repeat;
  opacity: 0;
  transition: opacity 600ms ease;
  will-change: transform, opacity;
  animation: boot-drift 18s ease-in-out infinite alternate;
}
.boot__art::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse at 50% 46%,
      rgb(0 0 0 / 0.78) 0%,
      rgb(0 0 0 / 0.5) 46%,
      rgb(0 0 0 / 0.28) 100%
    ),
    linear-gradient(to top, rgb(0 0 0 / 0.55), transparent 32%);
}
#boot.boot--art .boot__art {
  opacity: 1;
}
.boot__credit {
  position: absolute;
  left: calc(var(--u) * 40);
  bottom: calc(var(--u) * 40);
  font-size: calc(var(--u) * 22);
  color: var(--kour-text-2, #c5c5c5);
  text-shadow: var(--kour-text-shadow, 0.0427em 0.0651em 0.0066em rgb(0 0 0 / 0.537));
  opacity: 0;
  transition: opacity 600ms ease;
}
#boot.boot--art.boot--text .boot__credit {
  opacity: 0.75;
}
.boot__glow {
  position: absolute;
  left: 50%;
  top: 44%;
  width: calc(var(--u) * 1100);
  height: calc(var(--u) * 640);
  margin: calc(var(--u) * -320) 0 0 calc(var(--u) * -550);
  border-radius: 50%;
  background: radial-gradient(
    closest-side,
    color-mix(in srgb, var(--kour-kp, #ffd021) 16%, transparent),
    transparent
  );
  opacity: 0.6;
  will-change: transform, opacity;
  animation: boot-glow 3.4s ease-in-out infinite alternate;
}
.boot__center {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 450ms ease;
}
#boot.boot--out .boot__center {
  transform: scale(1.04);
}
.boot__logo {
  position: relative;
  width: calc(var(--u) * 820);
  /* the Airstrafing wordmark (1770 x 239, FB27) */
  aspect-ratio: 1770 / 239;
  will-change: transform;
  animation: boot-float 3.4s ease-in-out infinite alternate;
}
.boot__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  -webkit-user-drag: none;
  animation: boot-in 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.boot__bar {
  position: relative;
  width: calc(var(--u) * 560);
  height: max(2px, calc(var(--u) * 6));
  margin-top: calc(var(--u) * 54);
  border-radius: calc(var(--u) * 3);
  overflow: hidden;
  background: #4d4d4d;
  animation: boot-in 700ms 150ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.boot__fill {
  position: absolute;
  inset: 0;
  background: #0381df;
  transform-origin: 0 50%;
  transform: scaleX(0.02);
  will-change: transform;
  animation: boot-creep 9s cubic-bezier(0.1, 0.6, 0.3, 1) forwards;
}
#boot.boot--live .boot__fill {
  animation: none;
  transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.boot__fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.35), transparent);
  transform: translateX(-100%);
  animation: boot-sheen 1.8s ease-in-out infinite;
}
.boot__status {
  height: calc(var(--u) * 40);
  margin-top: calc(var(--u) * 16);
  font-size: calc(var(--u) * 26);
  line-height: calc(var(--u) * 40);
  white-space: nowrap;
  text-shadow: var(--kour-text-shadow, 0.0427em 0.0651em 0.0066em rgb(0 0 0 / 0.537));
  opacity: 0;
  transition: opacity 300ms ease;
}
#boot.boot--text .boot__status {
  opacity: 1;
}
.boot__pct {
  margin-left: 0.5em;
  color: var(--kour-text-2, #c5c5c5);
}
.boot__pct:empty {
  margin: 0;
}
.boot__mark {
  position: absolute;
  bottom: calc(var(--u) * 44);
  font-weight: var(--kour-weight-bold, 800);
  font-size: calc(var(--u) * 30);
  letter-spacing: 0.02em;
  text-shadow: var(--kour-text-shadow, 0.0427em 0.0651em 0.0066em rgb(0 0 0 / 0.537));
  opacity: 0;
  transition: opacity 300ms ease;
}
#boot.boot--text .boot__mark {
  opacity: 0.55;
}
.boot__mark span {
  color: var(--kour-kp, #ffd021);
}
@keyframes boot-in {
  from {
    opacity: 0;
    transform: scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes boot-float {
  from {
    transform: translateY(calc(var(--u) * 5));
  }
  to {
    transform: translateY(calc(var(--u) * -5)) scale(1.012);
  }
}
@keyframes boot-glow {
  from {
    opacity: 0.35;
    transform: scale(0.94);
  }
  to {
    opacity: 0.8;
    transform: scale(1.06);
  }
}
@keyframes boot-drift {
  from {
    transform: scale(1) translate(0, 0);
  }
  to {
    transform: scale(1.05) translate(calc(var(--u) * -18), calc(var(--u) * -8));
  }
}
@keyframes boot-creep {
  from {
    transform: scaleX(0.02);
  }
  to {
    transform: scaleX(0.12);
  }
}
@keyframes boot-sheen {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(100%);
  }
}
@media (prefers-reduced-motion: reduce) {
  .boot__art,
  .boot__glow,
  .boot__logo,
  .boot__img,
  .boot__bar,
  .boot__fill::after {
    animation: none;
  }
}
</style>
